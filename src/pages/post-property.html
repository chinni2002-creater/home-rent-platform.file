<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Property Free</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #141414;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }
        input, select, textarea {
            width: 100%;
            padding: 5px;
            margin: 10px 0;
            border: 1px solid #f3efefd7;
            border-radius: 5px;
        }
        .submit-btn {
            background-color: rgb(10, 190, 85);
            color: black;
            padding: 10px;
            width: 100%;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div>
            <a href="index.html">Home</a>
        </div>
    </div>
    
    <div class="container">
        <h2>Post Your Property</h2>
        <form id="property-form">
            <label>Property Title:</label>
            <input type="text" id="title" required>
            
            <label>Location:</label>
            <input type="text" id="location" required>
            
            <label>Price ($):</label>
            <input type="number" id="price" required>
            
            <label>Property Type:</label>
            <select id="type" required>
                <option value="Apartment">Apartment</option>
                <option value="Studio">Studio</option>
                <option value="Villa">Villa</option>
            </select>
            
            <label>Property Image URL:</label>
            <input type="text" id="image" required>
            
            <label>Description:</label>
            <textarea id="description" rows="4" required></textarea>
            
            <button type="submit" class="submit-btn">Submit Property</button>
        </form>
    </div>
    
    <script>
        document.getElementById("property-form").addEventListener("submit", function(event) {
            event.preventDefault();
            
            const title = document.getElementById("title").value;
            const location = document.getElementById("location").value;
            const price = document.getElementById("price").value;
            const type = document.getElementById("type").value;
            const image = document.getElementById("image").value;
            const description = document.getElementById("description").value;
            
            const property = {
                title,
                location,
                price: `$${price}/month`,
                type,
                image,
                description
            };
            
            let properties = JSON.parse(localStorage.getItem("properties")) || [];
            properties.push(property);
            localStorage.setItem("properties", JSON.stringify(properties));
            alert("Property posted successfully!");
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
